[package]
name = "codex-sub-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
gpui-kit = "=0.6.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
fs2 = "0.4"
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rand = "0.8"
chrono = "0.4"
futures-util = "0.3"
subtle = "2"
toml_edit = "0.23"

[profile.dev]
debug = 0

[profile.release]
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
tray-icon = "0.21"
